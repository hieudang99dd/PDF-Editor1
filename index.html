<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF EDITOR – Công cụ PDF và trình chỉnh sửa văn bản</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1a1f36;--mute:#667085;--line:#e1e5ee;--acc:#e8453c;--accs:#fdeceb;--navy:#1a1f36;--ok:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c2f;--ink:#eceef8;--mute:#9aa1bd;--line:#2a3050;--acc:#ff6a61;--accs:#3a1f27;--navy:#090b16}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c2f;--ink:#eceef8;--mute:#9aa1bd;--line:#2a3050;--acc:#ff6a61;--accs:#3a1f27;--navy:#090b16}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:20px;padding:12px 5vw;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .logo{font-weight:800;font-size:19px;cursor:pointer;background:none;border:0;color:#fff;padding:0}
header nav{display:flex;gap:4px;flex:1;overflow-x:auto}
header nav button{background:none;border:0;color:#cfd3e6;padding:6px 10px;border-radius:6px;white-space:nowrap}header nav button:hover{background:#ffffff1a;color:#fff}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;background:var(--acc);color:#fff}.btn:hover{filter:brightness(1.08)}
.btn.g{background:none;border:1px solid var(--line);color:var(--ink)}
.hero{padding:72px 5vw 40px;max-width:1100px;margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center}
.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.2;margin:0 0 16px;max-width:800px;letter-spacing:-0.02em}
.hero p{color:var(--mute);margin:0 0 32px;max-width:600px;font-size:16px}
.search{display:flex;gap:8px;width:100%;max-width:640px}.search input{flex:1;padding:14px 20px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;box-shadow:0 4px 24px rgba(0,0,0,0.04);transition:border-color .2s}
.wrap{max-width:1200px;margin:auto;padding:0 5vw 64px}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0 32px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:24px;padding:8px 18px;color:var(--mute);transition:all .2s;font-weight:500}.chip:hover{background:var(--line);color:var(--ink)}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2.cat{font-size:20px;margin:32px 0 16px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;display:flex;gap:16px;align-items:flex-start;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,0.02)}
.tool:hover{border-color:var(--acc);box-shadow:0 6px 16px rgba(0,0,0,0.06);transform:translateY(-2px)}
.ic{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:16px}
.tool b{display:block;font-size:15px;margin-bottom:4px;color:var(--ink)}.tool span{color:var(--mute);font-size:13px;line-height:1.4;display:block}

footer{padding:24px 5vw;color:var(--mute);font-size:13px;text-align:center}
/* workspace */
#ws{display:none;max-width:860px;margin:auto;padding:28px 5vw 48px}
.back{background:none;border:0;color:var(--mute);padding:0;margin-bottom:12px}
#ws h1{margin:0 0 4px;font-size:28px}#ws .d{color:var(--mute);margin:0 0 18px}
.drop{border:2px dashed var(--line);border-radius:12px;background:var(--card);padding:40px 20px;text-align:center}
.drop.hov{border-color:var(--acc);background:var(--accs)}.drop p{margin:8px 0 0;color:var(--mute);font-size:13px}
.files{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.files li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.files .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.files .s{color:var(--mute);font-size:12px}
.files button{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.opts{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0;display:grid;gap:12px}
.opts label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.opts input[type=text],.opts input[type=password],.opts select{padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.opts .r{display:flex;gap:14px;flex-wrap:wrap}.opts .r label{display:flex;gap:6px;align-items:center;color:var(--ink)}
#cv{width:100%;height:150px;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 6px}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
.res{background:var(--card);border:1px solid var(--ok);border-radius:10px;padding:16px;margin-top:14px}
.res b{color:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="hvd-ui-v2.css?v=20261016-dao1">
<style>
.hvd-workspace-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.hvd-workspace-nav .back{margin:0;padding:10px 0;font-weight:650}
.hvd-workspace-actions{display:flex;gap:8px;flex-wrap:wrap}
.hvd-workspace-actions .btn{padding:9px 12px;font-size:13px;white-space:nowrap}
.hvd-workspace-status{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:10px 12px;color:var(--mute);font-size:13px;margin:0 0 14px}
@media(max-width:550px){.hvd-workspace-nav{align-items:stretch}.hvd-workspace-actions{width:100%}.hvd-workspace-actions .btn{flex:1;white-space:normal}}
</style>
</head>
<body>
<header>
  <button class="logo" id="logo" aria-label="PDF EDITOR – Trang chủ"><span class="dao-mark" aria-hidden="true">P</span><span>PDF EDITOR</span></button>
  <nav id="nav"></nav>
  <a class="hvd-info-toggle" id="hvd-legal-source" href="NOTICE.md" target="_blank" rel="noopener noreferrer" aria-label="Xem thông tin mã nguồn và giấy phép" title="Mã nguồn và giấy phép">ⓘ</a>
  <button class="btn g" id="theme" type="button" aria-label="Đổi chế độ sáng hoặc tối" title="Đổi giao diện sáng/tối" style="color:#fff;border-color:#ffffff40">◐</button>
  <button class="btn" id="refresh-app" type="button" title="Làm mới nội dung đang xem, không tải lại trang" style="background:#4a5568">↻ Làm mới</button>
</header>

<main id="home">
  <section class="hero">
    <h1>Xử lý PDF dễ hơn, chỉ vài thao tác.</h1>
    <p>Nén, chuyển đổi, ghép, chỉnh sửa và ký tài liệu. Các công cụ cơ bản chạy trên web; OCR chạy trên trình duyệt; chuyển đổi Office cần engine cục bộ trên PC.</p>
    <div class="search"><input id="q" type="search" placeholder="Tìm công cụ, ví dụ: nén, Word, ký…" aria-label="Tìm công cụ"></div>
  </section>
  <div class="wrap"><div class="chips" id="chips"></div><div id="tools"></div></div>

  
</main>

<main id="ws">
  <div class="hvd-workspace-nav" role="group" aria-label="Điều hướng tác vụ PDF">
    <button class="back" id="back" type="button">← Danh mục công cụ</button>
    <div class="hvd-workspace-actions">
      <button class="btn g" id="ws-refresh" type="button" title="Đặt lại tùy chọn và kết quả nhưng giữ tệp đã chọn">↻ Làm mới tác vụ</button>
      <button class="btn g" id="ws-new" type="button" title="Chọn tệp mới và tiếp tục trong công cụ này">＋ Tệp khác</button>
    </div>
  </div>
  <h1 id="wt"></h1><p class="d" id="wd"></p>
  <p id="ws-status" class="hvd-workspace-status" role="status" aria-live="polite">Chọn tệp để bắt đầu.</p>
  <div id="stage"></div>
</main>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),C={'Nén':'#e8453c','Chuyển đổi':'#2f6fed','Sắp xếp':'#7a4fd6','Chỉnh sửa':'#0f9d8a','Ký & Bảo vệ':'#d98a00','AI PDF':'#c2388f','Quét':'#4a5568'};
// [tên, mô tả, nhóm, biểu tượng, kiểu tùy chọn, loại tệp]
const T=[
['Giảm dung lượng PDF','Giảm kích cỡ tệp mà vẫn giữ chất lượng','Nén','⇲','compress','.pdf'],
['Chuyển đổi PDF','Đổi PDF sang nhiều định dạng khác','Chuyển đổi','⇄','fmt','.pdf'],
['PDF OCR','Nhận dạng chữ trên bản quét thành văn bản','Chuyển đổi','OCR','paddle-ocr-route','.pdf'],
['PDF sang PDF/A','Chuẩn lưu trữ lâu dài','Chuyển đổi','A','none','.pdf'],
['PDF sang JPG','Tách mỗi trang thành ảnh JPG chất lượng cao','Chuyển đổi','JPG','pdf2jpg','.pdf'],
['PDF sang PNG','Tách mỗi trang thành ảnh PNG không nền mờ','Chuyển đổi','PNG','pdf2png','.pdf'],
['JPG sang PDF','Đổi JPG, PNG, BMP, GIF, WebP sang PDF','Chuyển đổi','▣','img','image/*'],
['PDF sang Word','Tạo tài liệu Word có thể sửa','Chuyển đổi','W','none','.pdf'],
['PDF sang Excel','Trích bảng thành bảng tính','Chuyển đổi','X','none','.pdf'],
['PDF sang PPT','Đổi trang thành slide','Chuyển đổi','P','none','.pdf'],
['Word sang PDF','Đổi DOC, DOCX sang PDF','Chuyển đổi','W','none','.doc,.docx'],
['Excel sang PDF','Đổi XLS, XLSX sang PDF','Chuyển đổi','X','none','.xls,.xlsx'],
['PPT sang PDF','Đổi PPT, PPTX sang PDF','Chuyển đổi','P','none','.ppt,.pptx'],
['TXT, RTF sang PDF','Đổi định dạng văn bản sang PDF','Chuyển đổi','T','none','.txt,.rtf,.html,.csv'],
['Quản lý trang PDF','Dàn trang, sắp xếp, xoay, ghép, tách và trích xuất bằng ảnh thu nhỏ','Sắp xếp','▦','pages-route','.pdf'],
['Ghép PDF','Gộp nhiều tệp thành một','Sắp xếp','⊕','merge','.pdf'],
['Cắt PDF','Tách tệp theo khoảng trang','Sắp xếp','✂','range','.pdf'],
['Xoay PDF','Xoay toàn bộ hoặc từng trang','Sắp xếp','⟳','rot','.pdf'],
['Xóa trang PDF','Bỏ các trang không cần','Sắp xếp','🗑','range','.pdf'],
['Trích xuất trang','Lấy riêng một số trang','Sắp xếp','⇥','range','.pdf'],
['Sắp xếp PDF','Kéo thả để đổi thứ tự trang','Sắp xếp','☰','organize','.pdf'],
['Chỉnh sửa văn bản PDF','Chỉnh sửa chữ gốc, phông chữ, định dạng và bố cục văn bản trực tiếp trên PDF.','Chỉnh sửa','T','cit-text-route','.pdf'],
['Chỉnh sửa PDF','Thêm chữ, ảnh, chữ ký, che trắng, highlight, vẽ tay','Chỉnh sửa','✎','organize','.pdf'],
['Xóa vector theo vùng','Cắt thực đường vector trong vùng tùy chọn; nhiều vùng và vùng bảo vệ, không phủ trắng','Chỉnh sửa','✂','region-eraser-route','.pdf'],
['Trình chú thích PDF','Tô sáng, che trắng, vẽ tay, ghi chú','Chỉnh sửa','▬','organize','.pdf'],
['Kiểm tra chất lượng PDF','Kiểm tra cấu trúc, phông chữ và rủi ro trước khi chỉnh sửa bằng bộ máy PDF chuyên sâu','Chỉnh sửa','✓','pdfium-inspect-route','.pdf'],
['Trình đọc PDF','Xem và duyệt nhanh tài liệu','Chỉnh sửa','👁','organize','.pdf'],
['Đánh số trang','Thêm số trang vào chân trang','Chỉnh sửa','#','pnum','.pdf'],
['Cắt lề PDF','Cắt bớt viền trang','Chỉnh sửa','⌗','organize','.pdf'],
['Biên tập lại (che thông tin)','Che vĩnh viễn nội dung nhạy cảm','Chỉnh sửa','█','organize','.pdf'],
['Watermark PDF','Chèn chữ mờ lên mọi trang','Chỉnh sửa','◍','wm','.pdf'],
['Điền biểu mẫu PDF','Nhập vào các trường của biểu mẫu','Chỉnh sửa','▤','organize','.pdf'],
['Chia sẻ PDF','Tạo liên kết chia sẻ tài liệu','Chỉnh sửa','↗','qr','.pdf'],
['PDF sang QR','Tạo mã QR để tải và chia sẻ tài liệu','Chỉnh sửa','QR','qr','.pdf'],
['Ký tên vào PDF','Ký tay, ảnh chữ ký và ký số bằng chứng thư','Ký & Bảo vệ','✍','signature-route','.pdf'],
['Yêu cầu chữ ký','Gửi tài liệu cho người khác ký','Ký & Bảo vệ','✉','mail','.pdf'],
['Mở khóa PDF','Gỡ mật khẩu khỏi tệp','Ký & Bảo vệ','🔓','pass','.pdf'],
['Bảo vệ PDF','Đặt mật khẩu cho tệp','Ký & Bảo vệ','🔒','pass2','.pdf'],
['Làm phẳng PDF','Gộp chú thích và biểu mẫu vào trang','Ký & Bảo vệ','▭','flatten','.pdf'],
['Trò chuyện với PDF','Hỏi đáp về nội dung tài liệu','AI PDF','AI','chat','.pdf'],
['Tóm tắt PDF','Rút gọn tài liệu dài','AI PDF','Σ','none','.pdf'],
['Dịch PDF','Dịch tài liệu sang ngôn ngữ khác','AI PDF','文','lang2','.pdf'],
['Tạo câu hỏi','Sinh câu hỏi ôn tập từ tài liệu','AI PDF','?','none','.pdf'],
['Trình quét PDF','Chụp giấy tờ thành PDF','Quét','⎙','img','image/*']];
let cat='Tất cả',tool=null,files=[];
try{
 const savedTheme=localStorage.getItem('hvd-theme');
 if(savedTheme==='light'||savedTheme==='dark')document.documentElement.dataset.theme=savedTheme;
}catch(_){} 
const cats=['Tất cả',...Object.keys(C)];
const hvdDownloadUrls=new Set();
let hvdDownloadRequested=false;
function trackDownloadUrl(blob){const url=URL.createObjectURL(blob);hvdDownloadUrls.add(url);return url;}
function releaseWorkspaceDownloads(){
 hvdDownloadRequested=false;
 if(!hvdDownloadUrls.size)return;
 const urls=[...hvdDownloadUrls];hvdDownloadUrls.clear();
 // Browsers start large downloads asynchronously: give the generated URL time to be read.
 setTimeout(()=>urls.forEach(url=>URL.revokeObjectURL(url)),120000);
}
window.hvdTrackDownloadUrl=trackDownloadUrl;
window.hvdReleaseWorkspaceDownloads=releaseWorkspaceDownloads;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
function home(){const q=$('#q').value.trim().toLowerCase();
 $('#chips').innerHTML=cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${c}">${c}</button>`).join('');
 let h='';for(const c of Object.keys(C)){if(cat!='Tất cả'&&cat!=c)continue;
  const l=T.map((t,i)=>[t,i]).filter(([t])=>t[2]==c&&(t[0]+t[1]).toLowerCase().includes(q));if(!l.length)continue;
  h+=`<h2 class="cat">${c}</h2><div class="grid">`+l.map(([t,i])=>{
   const isSim = !(t[4].startsWith('cit-') || t[4].startsWith('pdfium-') || ['paddle-ocr-route', 'merge', 'range', 'rot', 'organize', 'region-eraser-route', 'img', 'pdf2jpg', 'pdf2png', 'wm', 'pnum', 'signature-route', 'flatten'].includes(t[4]) || ['Giảm dung lượng PDF','Chuyển đổi PDF','PDF OCR','PDF sang Word','PDF sang TXT','PDF sang TIFF','Word sang PDF','Excel sang PDF','PPT sang PDF'].includes(t[0]));
   const needsPC = ['PDF sang Word','PDF sang TIFF','Word sang PDF','Excel sang PDF','PPT sang PDF'].includes(t[0]);
   const hybrid = t[0] === 'Chuyển đổi PDF';
   const badge = isSim ? `<span style="font-size:10px; background:var(--line); color:var(--mute); padding:2px 6px; border-radius:4px; align-self:center">Sắp ra mắt</span>` :
    needsPC ? `<span style="font-size:10px; background:var(--line); color:var(--mute); padding:2px 6px; border-radius:4px; align-self:center">Cần engine PC</span>` :
    hybrid ? `<span style="font-size:10px; background:var(--line); color:var(--mute); padding:2px 6px; border-radius:4px; align-self:center">Web / PC</span>` : '';
   return `<button class="tool" data-i="${i}"><div class="ic" style="background:${C[c]}">${t[3]}</div><div style="flex:1"><b>${t[0]}</b><span>${t[1]}</span></div>${badge}</button>`;
  }).join('')+`</div>`}
 $('#tools').innerHTML=h||'<p style="color:var(--mute)">Không tìm thấy công cụ phù hợp. Thử từ khóa khác.</p>'}
$('#nav').innerHTML=['Nén','Chuyển đổi','Sắp xếp','Chỉnh sửa','Ký & Bảo vệ','AI PDF'].map(c=>`<button data-nav="${c}">${c}</button>`).join('');
const sz=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
const OPT={
 compress:`<label>Mức nén</label><div class="r"><label><input type="radio" name="lv" value="basic" checked> Cơ bản (nhanh, giữ chất lượng cao)</label><label><input type="radio" name="lv" value="strong"> Mạnh (tối ưu dung lượng)</label></div>`,
 fmt:`<label>Định dạng đầu ra<select id="fmt-sel"><option value="jpg">JPG</option><option value="png">PNG</option><option value="word">Word (.docx)</option><option value="excel">Excel (.xlsx)</option><option value="pdfa">PDF/A</option></select></label>`,
 lang:`<label>Ngôn ngữ trong tài liệu<select><option>Tiếng Việt</option><option>English</option><option>日本語</option></select></label>`,
 lang2:`<label>Dịch sang<select><option>Tiếng Việt</option><option>English</option><option>Français</option><option>中文</option></select></label>`,
 img:`<div class="r"><label>Khổ giấy<select id="img-paper"><option value="a4">A4 (chuẩn)</option><option value="fit">Vừa với ảnh</option><option value="letter">Letter</option></select></label><label>Hướng<select id="img-orient"><option value="p">Dọc</option><option value="l">Ngang</option></select></label></div>`,
 merge:`<label>Kéo bằng nút ↑ ↓ trong danh sách để đổi thứ tự tệp. Cần ít nhất 2 tệp.</label>`,
 range:`<label>Trang cần xử lý (ví dụ: 1-3, 5, 8-10)<input type="text" id="rg" placeholder="1-3, 5"></label>`,
 rot:`<div class="r"><label><input type="radio" name="r" checked> 90° phải</label><label><input type="radio" name="r"> 90° trái</label><label><input type="radio" name="r"> 180°</label></div>`,
 pnum:`<div class="r"><label>Vị trí<select id="pn-pos"><option value="c">Giữa, dưới</option><option value="r">Phải, dưới</option><option value="l">Trái, dưới</option></select></label><label>Bắt đầu từ<input type="number" id="pn-start" value="1" style="width:70px"></label><label>Định dạng<select id="pn-fmt"><option value="trang_n">Trang X / N</option><option value="n">X</option></select></label></div>`,

 }

 if($('#go'))$('#go').onclick=run;if($('#cv'))canvas();}
function add(fl){const m=tool[4]=='merge'||tool[5].includes('image');files=m?[...files,...fl]:[fl[0]];render()}
function canvas(){const c=$('#cv'),x=c.getContext('2d');x.lineWidth=4;x.lineCap='round';x.strokeStyle='#1b2a6b';let d=0;

async function run(){
 const k=tool[4];
 if(k=='merge'&&files.length<2)return toast('Cần ít nhất 2 tệp để ghép');
 if(k=='range'&&!$('#rg').value.trim())return toast('Nhập khoảng trang cần xử lý');
 if(k=='pass2'&&(!$('#pw').value||$('#pw').value!=$('#pw2').value))return toast('Mật khẩu chưa khớp');
 if(k=='pass'&&!$('#pw').value)return toast('Nhập mật khẩu hiện tại');
 
 if(k=='organize'){
  if(typeof initOrganizer!=='function') return toast('Đang tải công cụ, vui lòng đợi...');
  $('#go').style.display='none';
  initOrganizer(files);
  return;
 }
 
 const b=$('#go');releaseWorkspaceDownloads();b.disabled=true;
 $('#out').innerHTML=`<div class="bar"><i id="pb"></i></div><span style="color:var(--mute);font-size:13px" id="st">Đang xử lý trên trình duyệt...</span>`;
 
 if(k=='compress') {
  try {
   const formData = new FormData();
   formData.append('file', files[0]);
   const r = document.querySelector('input[name="lv"]:checked');
   const lvl = r ? r.parentElement.textContent.trim() : 'Cơ bản';
   formData.append('level', lvl);
   
   $('#pb').style.width = '50%';
   const res = await fetch('http://localhost:8000/compress', {
     method: 'POST',
     body: formData
   });
   
   if(!res.ok) throw new Error("Backend không phản hồi");
   
   const blob = await res.blob();
   const url = trackDownloadUrl(blob);
   $('#pb').style.width = '100%';
   
   const originalSize = files[0].size;
   const newSize = blob.size;
   const saved = originalSize - newSize;
   const percentage = originalSize > 0 ? Math.max(0, Math.round((saved / originalSize) * 100)) : 0;
   
   $('#out').innerHTML=`<div class="res"><b>Hoàn tất.</b> Dung lượng giảm từ ${sz(originalSize)} còn ${sz(newSize)} (giảm ${percentage}%).<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="${url}" download="compressed_${files[0].name}">Tải xuống</a><button class="btn g" id="again">Xử lý tệp khác</button></div></div>`;
   $('#again').onclick=()=>{files=[];render()};
   b.disabled=false;
  } catch(e) {
   console.error(e);
   toast('Lỗi: Cần chạy Backend cục bộ tại port 8000 để sử dụng AI Nén PDF');
   $('#out').innerHTML='';
   b.disabled=false;
  }
  return;
 }

 if(k=='merge'||k=='range'||k=='rot'){
  try {
   const { PDFDocument } = window.PDFLib;
   let resultPdf = await PDFDocument.create();
   
   if(k=='merge') {
    for(let f of files) {
     const doc = await PDFDocument.load(await f.arrayBuffer());
     const pages = await resultPdf.copyPages(doc, doc.getPageIndices());
     pages.forEach(p => resultPdf.addPage(p));
    }
   } else if(k=='rot') {
    const doc = await PDFDocument.load(await files[0].arrayBuffer());
    const r = $('input[name="r"]:checked');
    const angleText = r ? r.nextSibling.textContent.trim() : '90° phải';
    let angle = 90;
    if(angleText.includes('trái')) angle = -90;
    else if(angleText.includes('180')) angle = 180;
    
    doc.getPages().forEach(p => {
     p.setRotation(window.PDFLib.degrees(p.getRotation().angle + angle));
    });
    resultPdf = doc;
   } else if(k=='range') {
    const doc = await PDFDocument.load(await files[0].arrayBuffer());
    const val = $('#rg').value.replace(/ /g,'').split(',');
    const pagesToProcess = new Set();
    for(let v of val) {
     if(v.includes('-')) {
      let [s, e] = v.split('-').map(Number);
      for(let i=s; i<=e; i++) pagesToProcess.add(i);
     } else pagesToProcess.add(Number(v));
    }
    const isDelete = tool[0].includes('Xóa');
    const indicesToCopy = [];
    doc.getPageIndices().forEach(i => {
     const pageNum = i + 1;
     if((!isDelete && pagesToProcess.has(pageNum)) || (isDelete && !pagesToProcess.has(pageNum))) {
      indicesToCopy.push(i);
     }
    });
    if(indicesToCopy.length === 0) throw new Error("Không còn trang nào sau khi xử lý");
    const copied = await resultPdf.copyPages(doc, indicesToCopy);
    copied.forEach(p => resultPdf.addPage(p));
   }
   
   $('#pb').style.width = '80%';
   const pdfBytes = await resultPdf.save();
   const blob = new Blob([pdfBytes], {type: 'application/pdf'});
   const url = trackDownloadUrl(blob);
   
   $('#pb').style.width = '100%';
   $('#out').innerHTML=`<div class="res"><b>Hoàn tất.</b> <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="${url}" download="processed.pdf">Tải xuống</a><button class="btn g" id="again">Xử lý tệp khác</button></div></div>`;
   $('#again').onclick=()=>{files=[];render()};
   b.disabled=false;
  } catch(e) {
   toast('Lỗi: '+e.message);$('#out').innerHTML='';b.disabled=false;
  }
  return;
 }
 
 if(k=='qr'){
  // This static website has no file-hosting server; never generate a fake share URL.
  $('#out').innerHTML='<div class="res"><b>Chưa hỗ trợ chia sẻ PDF qua đường dẫn.</b><p>Chức năng này cần máy chủ lưu file và liên kết thực. Không tạo QR giả hoặc tuyên bố đã tải PDF lên mạng.</p></div>';

 }

 if(k=='img'){

   const paper = $('#img-paper') ? $('#img-paper').value : 'a4';
   const orient = $('#img-orient') ? $('#img-orient').value : 'p';
   for(let i = 0; i < files.length; i++){
     const file = files[i];
     let bytes = await file.arrayBuffer();
     let img;
     if (file.type === 'image/png' || file.name.toLowerCase().endsWith('.png')) {
       img = await doc.embedPng(bytes);
     } else {
       try {
         img = await doc.embedJpg(bytes);
       } catch(e) {
         const imgObj = await new Promise((res, rej) => {
           const im = new Image();
           const previewUrl = URL.createObjectURL(file);
           im.onload = () => { URL.revokeObjectURL(previewUrl); res(im); };
           im.onerror = err => { URL.revokeObjectURL(previewUrl); rej(err); };
           im.src = previewUrl;
         });
         const c = document.createElement('canvas');
         c.width = imgObj.width; c.height = imgObj.height;
         c.getContext('2d').drawImage(imgObj, 0, 0);
         const dataUrl = c.toDataURL('image/jpeg', 0.92);
         img = await doc.embedJpg(dataUrl);
       }
     }
     let pw, ph;
     if(paper === 'a4'){
       pw = orient === 'p' ? 595.28 : 841.89;
       ph = orient === 'p' ? 841.89 : 595.28;
     } else if(paper === 'letter'){
       pw = orient === 'p' ? 612 : 792;
       ph = orient === 'p' ? 792 : 612;
     } else {
       pw = img.width; ph = img.height;
     }
     const page = doc.addPage([pw, ph]);
     const scale = Math.min(pw / img.width, ph / img.height);
     const dw = img.width * scale;
     const dh = img.height * scale;
     const dx = (pw - dw) / 2;
     const dy = (ph - dh) / 2;
     page.drawImage(img, { x: dx, y: dy, width: dw, height: dh });
     $('#pb').style.width = Math.min(90, 20 + Math.round((70 * (i + 1)) / files.length)) + '%';
   }
   const pdfBytes = await doc.save();
   const blob = new Blob([pdfBytes], { type: 'application/pdf' });
   const url = trackDownloadUrl(blob);
   $('#pb').style.width = '100%';
   $('#out').innerHTML=`<div class="res"><b>Hoàn tất.</b> Đã tạo PDF từ ${files.length} ảnh.<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="${url}" download="images_to_pdf.pdf">Tải xuống PDF</a><button class="btn g" id="again">Xử lý tệp khác</button></div></div>`;
   $('#again').onclick=()=>{files=[];render()};

   toast('Lỗi: '+e.message);$('#out').innerHTML='';b.disabled=false;

  return;

 if(k=='pdf2jpg'||k=='pdf2png'){

 if(k=='wm'){

     const size = 10;
     const strW = font.widthOfTextAtSize(str, size);
     let x = (width - strW) / 2;
     if(pos === 'l') x = 36;
     else if(pos === 'r') x = width - strW - 36;
     p.drawText(str, {
       x,
       y: 24,
       size,
       font,
       color: rgb(0.3, 0.3, 0.3)
     });
     $('#pb').style.width = Math.min(90, 30 + Math.round((60 * (i + 1)) / total)) + '%';
   }
   const pdfBytes = await doc.save();
   const blob = new Blob([pdfBytes], { type: 'application/pdf' });
   const url = trackDownloadUrl(blob);
   $('#pb').style.width = '100%';
   $('#out').innerHTML=`<div class="res"><b>Hoàn tất.</b> Đã đánh số trang cho ${total} trang.<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="${url}" download="numbered_${files[0].name}">Tải xuống PDF</a><button class="btn g" id="again">Xử lý tệp khác</button></div></div>`;
   $('#again').onclick=()=>{files=[];render()};
   b.disabled=false;
  } catch(e) {
   toast('Lỗi: '+e.message);$('#out').innerHTML='';b.disabled=false;
  }
  return;
 }

 if(k=='sign'){
  try {
   const cv = $('#cv');
   if(!cv) throw new Error('Không tìm thấy khung ký tên');
   const ctx = cv.getContext('2d');
   const imgData = ctx.getImageData(0, 0, cv.width, cv.height).data;
   let hasInk = false;
   for(let i = 3; i < imgData.length; i += 4){
     if(imgData[i] > 20){ hasInk = true; break; }
   }
   if(!hasInk) {
     toast('Vui lòng vẽ chữ ký của bạn trước khi tiếp tục');
     b.disabled=false;
     return;
   }
   $('#pb').style.width = '40%';
   const { PDFDocument } = window.PDFLib;
   const doc = await PDFDocument.load(await files[0].arrayBuffer());
   const sigPng = cv.toDataURL('image/png');
   const sigImg = await doc.embedPng(sigPng);
   const pages = doc.getPages();
   const lastPage = pages[pages.length - 1];
   const { width, height } = lastPage.getSize();
   const sigW = 160;
   const sigH = (cv.height / cv.width) * sigW;
   lastPage.drawImage(sigImg, {
     x: width - sigW - 40,
     y: 40,
     width: sigW,
     height: sigH
   });
   $('#pb').style.width = '85%';
   const pdfBytes = await doc.save();
   const blob = new Blob([pdfBytes], { type: 'application/pdf' });
   const url = trackDownloadUrl(blob);
   $('#pb').style.width = '100%';
   $('#out').innerHTML=`<div class="res"><b>Hoàn tất.</b> Chữ ký đã được đóng dấu vào trang cuối cùng của tài liệu.<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="${url}" download="signed_${files[0].name}">Tải xuống PDF</a><button class="btn g" id="again">Xử lý tệp khác</button></div></div>`;
   $('#again').onclick=()=>{files=[];render()};
   b.disabled=false;
  } catch(e) {
   toast('Lỗi: '+e.message);$('#out').innerHTML='';b.disabled=false;
  }
  return;
 }

 if(k=='flatten'){
  try {
   $('#pb').style.width = '40%';
   const { PDFDocument } = window.PDFLib;
   const doc = await PDFDocument.load(await files[0].arrayBuffer());
   if(doc.getForm) {
     try { doc.getForm().flatten(); } catch(e){}
   }
   $('#pb').style.width = '80%';
   const pdfBytes = await doc.save();
   const blob = new Blob([pdfBytes], { type: 'application/pdf' });
   const url = trackDownloadUrl(blob);
   $('#pb').style.width = '100%';
   $('#out').innerHTML=`<div class="res"><b>Hoàn tất.</b> Đã làm phẳng các trường biểu mẫu và chú thích vào tài liệu.<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="${url}" download="flattened_${files[0].name}">Tải xuống PDF</a><button class="btn g" id="again">Xử lý tệp khác</button></div></div>`;
   $('#again').onclick=()=>{files=[];render()};
   b.disabled=false;
  } catch(e) {
   toast('Lỗi: '+e.message);$('#out').innerHTML='';b.disabled=false;
  }
  return;
 }

 if(!['paddle-ocr-route', 'merge', 'range', 'rot', 'organize', 'qr', 'img', 'pdf2jpg', 'pdf2png', 'wm', 'pnum', 'signature-route', 'flatten'].includes(k)) {
  $('#out').innerHTML=`<div class="res"><b>Tính năng sắp ra mắt</b><p style="margin:4px 0 0;font-size:13px;color:var(--mute)">Công cụ này đang được phát triển và sẽ sớm có mặt. Xin cảm ơn!</p></div>`;
  b.disabled=false;
  return;
 }
}
function done(){const tot=files.reduce((a,f)=>a+f.size,0),k=tool[4];
 const extra=k=='compress'?`Dung lượng giảm từ ${sz(tot)} còn khoảng ${sz(tot*.42)} (ước tính mô phỏng).`:`${files.length} tệp đã được xử lý.`;
 $('#out').innerHTML=`<div class="res"><b>Hoàn tất.</b> ${extra}<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="dl">Tải xuống</button><button class="btn g" id="again">Xử lý tệp khác</button></div></div>`;
 $('#dl').onclick=()=>toast('Đây là giao diện mẫu, chưa tạo tệp thật');$('#again').onclick=()=>{files=[];render()};$('#go').disabled=false}
function showCatalog(){
 $('#ws').style.display='none';$('#home').style.display='block';home();
}
function back(){
 if($('#ws').style.display!=='none'&&$('#go')?.disabled){
  toast('Đang xử lý PDF. Vui lòng chờ hoàn tất trước khi rời tác vụ.');return;
 }
 if($('#ws').style.display!=='none'&&$('#stage a[download]')&&!hvdDownloadRequested&&!confirm('Kết quả đã tạo nhưng chưa được yêu cầu tải xuống. Bạn vẫn muốn rời công cụ?'))return;
 showCatalog();
 if(history.state?.hvdTool!==undefined)history.back();
 else if(location.hash.startsWith('#hvd-tool='))history.replaceState(null,'',location.pathname+location.search);
}
function resetWorkspace(clearFiles=false){
 if($('#ws').style.display==='none'||!tool)return;
 if(tool[4]==='organize'&&document.querySelector('#po-back')){
  toast('Vui lòng dùng nút Làm mới trong trình quản lý PDF.');return;
 }
 if($('#go')?.disabled){toast('Đang xử lý. Vui lòng chờ hoàn tất trước khi làm mới.');return;}
 if(files.length&&!confirm(clearFiles?'Chọn tệp mới? Tệp đang chọn và kết quả trên màn hình sẽ được bỏ khỏi công cụ này.':'Làm mới tùy chọn và kết quả? Tệp đang chọn sẽ được giữ lại.'))return;
 if(clearFiles)files=[];
 render();
 $('#ws-status').textContent=clearFiles?'Có thể tải tài liệu mới vào công cụ hiện tại.':'Đã làm mới tác vụ. Bạn có thể chỉnh tùy chọn và thực hiện lại.';
}
window.addEventListener('popstate',()=>{
 const match=location.hash.match(/^#hvd-tool=([0-9]+)$/);
 const idx=match?Number(match[1]):-1;
 if(idx>=0&&T[idx]&&!['cit-text-route','pdfium-inspect-route','region-eraser-route'].includes(T[idx][4])){
  openTool(idx,true);
 }else showCatalog();
});
window.addEventListener('DOMContentLoaded',()=>{
 const match=location.hash.match(/^#hvd-tool=([0-9]+)$/);
 if(match){
  const idx=Number(match[1]);
  if(T[idx]&&!['cit-text-route','pdfium-inspect-route','region-eraser-route'].includes(T[idx][4]))openTool(idx,true);
 }
});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.c){cat=b.dataset.c;home()}
 if(b.dataset.nav){back();cat=b.dataset.nav;home();$('#tools').scrollIntoView()}
 if(b.dataset.i!=null&&b.classList.contains('tool'))openTool(+b.dataset.i);
 if(b.dataset.x!=null){files.splice(+b.dataset.x,1);render()}
 if(b.dataset.m){const[k,d]=b.dataset.m.split(':').map(Number),j=k+d;if(files[j]){[files[k],files[j]]=[files[j],files[k]];render()}}
 if(b.id=='logo'){cat='Tất cả';$('#q').value='';back()}
 if(b.id=='back')back();
 if(b.id=='ws-refresh')resetWorkspace(false);
 if(b.id=='ws-new')resetWorkspace(true);
 if(b.id=='theme'){
  const r=document.documentElement;
  const prefersDark=window.matchMedia?.('(prefers-color-scheme: dark)').matches||false;
  const isDark=r.dataset.theme==='dark'||(!r.dataset.theme&&prefersDark);
  const next=isDark?'light':'dark';
  r.dataset.theme=next;
  try{localStorage.setItem('hvd-theme',next)}catch(_){}
  b.setAttribute('aria-label',next==='dark'?'Chuyển sang giao diện sáng':'Chuyển sang giao diện tối');
}
 if(b.id=='refresh-app'){
  if($('#ws').style.display!=='none')resetWorkspace(false);
  else{$('#q').value='';cat='Tất cả';home();toast('Đã làm mới danh mục công cụ.');}
 }
});
document.addEventListener('click',e=>{
 const link=e.target.closest('#ws a[download], #stage a[download]');
 if(link&&$('#ws').style.display!=='none'){
  hvdDownloadRequested=true;
  $('#ws-status').textContent='Đã yêu cầu tải xuống. Bạn có thể tiếp tục chỉnh tùy chọn hoặc xử lý tệp khác tại đây.';
 }
});
$('#q').oninput=home;home();
</script>
