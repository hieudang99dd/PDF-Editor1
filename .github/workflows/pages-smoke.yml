name: PDF EDITOR Pages smoke checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  pages-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check static HTML and browser PDF fallback
        run: node --check pdf-editor-workspace.js && node --test tests/pdf-editor-integration.test.cjs && node --check studio/hvd-text-apply.js && node tests/text-editor-asset-paths.cjs && node --check pdfium-preflight-core.mjs && node --check pdfium-preflight-worker.mjs && node --check region-eraser.js && node --check pdf-region-worker.mjs && node --check pdf-region-client.mjs && node --check pdf-region-native.mjs && node --check pdf-region-geometry.mjs && node --test tests/pdf-region-notification-dock.test.cjs tests/pdf-region-fit-layout.test.cjs tests/pdf-region-handles.test.cjs tests/pdf-region-fixed-layout.test.cjs tests/brand-dao-chich.test.cjs tests/pdf-region-apply-export.test.cjs tests/pdf-region-all-objects.test.cjs tests/pdf-region-rotation.test.cjs tests/pdf-region-boolean-gallery.test.cjs tests/pdf-region-512mb.test.cjs tests/pdf-region-geometry.test.cjs tests/pdf-region-native.test.cjs tests/organizer-reset.test.cjs tests/ux-session.test.cjs tests/repository-hygiene.test.cjs tests/studio-brand.test.cjs tests/pdfium-preflight.test.cjs tests/pages-smoke.test.cjs tests/home-layout.test.cjs tests/home-legal.test.cjs tests/cit-advanced.test.cjs tests/cit-advanced-ui.test.cjs tests/rich-native.test.cjs tests/batch-text.test.cjs tests/native-text.test.cjs tests/text-layout.test.cjs tests/text-editor-route.test.cjs tests/hvd-cit-hub.test.cjs tests/studio-text-apply.test.cjs
