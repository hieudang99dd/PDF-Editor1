<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Chỉnh sửa Text PDF – PDF EDITOR</title>
<meta name="description" content="Chỉnh sửa văn bản PDF bằng công nghệ xử lý trực tiếp – giữ font, Unicode, bảng và nét vector.">
<link rel="stylesheet" href="text-editor.css?v=1">
</head>
<body class="hdv-cit-text-route">
<!-- Host elements required by the existing PDF EDITOR organizer; real editor is created by PDFOrganizer. -->
<header id="hdv-host-header" hidden></header>
<main id="home" hidden></main>
<main id="ws" hidden></main>
<div id="toast" role="status" aria-live="polite"></div>
<input id="hdv-text-file-picker" type="file" accept=".pdf,application/pdf" hidden>
<script src="pdf-lib.min.js"></script>
<script src="pdf.min.js"></script>
<script>
  window.pdfjsLib=window.pdfjsLib||window['pdfjs-dist/build/pdf'];
  if(window.pdfjsLib)window.pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
  function toast(message){
    let node=document.getElementById('toast');node.textContent=message;
    node.classList.add('show');clearTimeout(toast.timeout);
    toast.timeout=setTimeout(()=>node.classList.remove('show'),3300);
  }
</script>
<script src="Sortable.min.js"></script>
<script src="jszip.min.js"></script>
<script src="fontkit.umd.min.js"></script>
<script src="pdf-text-layout.js?v=39"></script>
<script src="organizer.js?v=20261106-download-only2"></script>
<script src="pdf-batch-text.js?v=44"></script>
<script src="text-editor-shell.js?v=20261016-dao1"></script>
</body>
</html>
